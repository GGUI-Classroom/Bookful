{% extends "base.html" %}
{% block title %}Bookful | Classroom Library Tracker{% endblock %}
{% block content %}
<section class="landing-hero">
  <div class="landing-copy">
    <p class="landing-kicker">Classroom library</p>
    <h1 class="landing-title">Keep track of your books.</h1>
    <p class="landing-subtitle">Add your books and students, then check books in and out.</p>
    <div class="landing-actions">
      <a class="btn btn-lg btn-landing-primary" href="{{ url_for('auth.signup') }}">Get started</a>
      <a class="btn btn-lg btn-landing-secondary" href="{{ url_for('auth.login') }}">Log in</a>
    </div>
    <p class="landing-class-code">Have a class code? <a href="{{ url_for('portal.join_with_code') }}">Join here</a></p>
  </div>
</section>
{% endblock %}
